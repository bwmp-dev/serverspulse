name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every toolchain the build targets. Gradle itself runs on the last entry
      # (21); the others are picked up as toolchains via the JAVA_HOME_*_X64
      # variables listed in gradle.properties. Java 25 is required by the
      # Minecraft 26.x bands.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
            25
            21
          cache: gradle

      - name: Build all agent artifacts
        run: ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: serverspulse-agent
          path: build/artifacts/*.jar
          if-no-files-found: error
