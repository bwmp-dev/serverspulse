name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      # Must match the toolchain list in ci.yml; see gradle.properties.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
            25
            21
          cache: gradle

      # Guards against the release-please updater silently missing
      # gradle.properties, which would produce jars named for the old version.
      - name: Verify release version reached gradle.properties
        shell: bash
        run: |
          expected="${{ needs.release-please.outputs.version }}"
          actual="$(sed -n 's/^version=//p' gradle.properties)"
          test "$expected" = "$actual"

      - name: Build release artifacts
        run: ./gradlew build --no-daemon

      - name: Attach artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" build/artifacts/*.jar
