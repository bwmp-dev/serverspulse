name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4

      # Must match the toolchain list in ci.yml; see gradle.properties.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
            25
            21
          cache: gradle

      - name: Verify tag matches Gradle version
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(sed -n 's/^version=//p' gradle.properties)"
          test "$expected" = "$actual"

      - name: Build release artifacts
        run: ./gradlew build --no-daemon

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/artifacts/*.jar --generate-notes --verify-tag
