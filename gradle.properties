group=com.serverspulse
# x-release-please-start-version
version=0.1.0
# x-release-please-end
description=ServersPulse Minecraft monitoring agent

kotlin.code.style=official
org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true
org.gradle.caching=true

# The build spans four toolchains: Java 8 (Forge 1.16.5), 17 (Bukkit/Fabric/
# Forge 1.20.1), 21 (Forge 1.21.x, NeoForge 1.20.6/1.21.1) and 25 (the
# Minecraft 26.x bands, which Mojang requires Java 25 for). CI installs them
# via actions/setup-java, which exports these variables; listing them here
# means Gradle finds every toolchain instead of relying on whatever the runner
# image happens to preinstall.
org.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64
