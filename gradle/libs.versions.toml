####
# Single source of truth for every third-party version in this build.
#
# Platform modules previously repeated `version "..."` inline in their own
# `plugins {}` and `dependencies {}` blocks, which drifted from this file. They
# now all resolve through the aliases below, so a bump here reaches every
# artifact. `build-logic` imports this same file (see its settings.gradle.kts)
# so the convention plugins stay on the same Kotlin/Shadow versions.
#
# Per-Minecraft-version aliases are suffixed `mcXYZ` rather than `1-21-11`
# because Gradle cannot generate type-safe accessors for numeric segments.
####

[versions]

## Build toolchain ##########################################################
kotlin = "2.4.10"
shadow = "9.6.1"

## Libraries shaded into every platform artifact ############################
# These must stay Java 8 compatible: the Bukkit, Fabric and Forge 1.16.5
# artifacts all emit Java 8 bytecode for legacy servers.
gson = "2.14.0"
okhttp = "5.4.0"
snakeyaml = "2.6"

## Compile-only server APIs #################################################
log4j = "2.26.1"
brigadier = "1.3.10"

## Bukkit ###################################################################
# Compiled against the oldest supported API; newer servers are handled by
# reflection in platform-bukkit/version/. A floor, not a ceiling.
spigot-api = "1.8.8-R0.1-SNAPSHOT"

## Fabric ###################################################################
# The Fabric artifact is one version-agnostic jar. It compiles against the
# oldest supported release and resolves everything newer reflectively via
# FabricCompat, so these pin the compile floor, not the supported ceiling.
fabric-loom = "1.17.17"
fabric-minecraft = "1.14.4"
fabric-yarn = "1.14.4+build.18"
fabric-loader = "0.10.5+build.213"
fabric-api = "0.28.5+1.14"

## NeoForge #################################################################
neoforge-moddev = "2.0.143"
neoforge-mc1206 = "20.6.139"
neoforge-mc1211 = "21.1.244"
neoforge-mc2612 = "26.1.2.87"

## Forge ####################################################################
# Bands are per-Minecraft-version because Forge's event bus and mappings
# change incompatibly between them. See platform-forge/COMPATIBILITY.md.
forge-mc1165 = "1.16.5-36.2.42"
forge-mc1201 = "1.20.1-47.4.22"
forge-mc1211 = "1.21.1-52.1.16"
forge-mc12111 = "1.21.11-61.1.14"
forge-mc262 = "26.2-65.1.0"
# Vanilla Minecraft 26.2 in official mappings, used as the compile classpath
# for the Forge 26.2 band (see that module's build script for why).
neoform-mc262 = "26.2-2"

# Forge-internal artifacts, versioned independently of the Forge release.
forge-eventbus-mc1165 = "4.0.0"
forge-eventbus-mc1211 = "6.2.27"
forge-eventbus-mc12111 = "7.0.1"
forge-eventbus-mc262 = "7.0.5"
forge-spi-mc1165 = "3.2.0"
forge-spi-mc1211 = "7.1.5"
forge-spi-mc12111 = "8.0.0"
forge-spi-mc262 = "8.0.0"
brigadier-mc1165 = "1.0.18"

# Reobfuscates the 1.16.5 artifact from official names back to SRG.
forge-autorenamingtool = "1.1.2"

[libraries]

## Shaded into every platform artifact ######################################
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }

## Compile-only #############################################################
log4j-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j" }
brigadier = { module = "com.mojang:brigadier", version.ref = "brigadier" }
spigot-api = { module = "org.spigotmc:spigot-api", version.ref = "spigot-api" }

## Fabric ###################################################################
fabric-minecraft = { module = "com.mojang:minecraft", version.ref = "fabric-minecraft" }
fabric-yarn = { module = "net.fabricmc:yarn", version.ref = "fabric-yarn" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }

## Forge 1.16.5 #############################################################
forge-eventbus-mc1165 = { module = "net.minecraftforge:eventbus", version.ref = "forge-eventbus-mc1165" }
forge-spi-mc1165 = { module = "net.minecraftforge:forgespi", version.ref = "forge-spi-mc1165" }
brigadier-mc1165 = { module = "com.mojang:brigadier", version.ref = "brigadier-mc1165" }
forge-autorenamingtool = { module = "net.minecraftforge:ForgeAutoRenamingTool", version.ref = "forge-autorenamingtool" }

## Forge 1.21.1 #############################################################
forge-universal-mc1211 = { module = "net.minecraftforge:forge", version.ref = "forge-mc1211" }
forge-fmlloader-mc1211 = { module = "net.minecraftforge:fmlloader", version.ref = "forge-mc1211" }
forge-fmlcore-mc1211 = { module = "net.minecraftforge:fmlcore", version.ref = "forge-mc1211" }
forge-javafml-mc1211 = { module = "net.minecraftforge:javafmllanguage", version.ref = "forge-mc1211" }
forge-eventbus-mc1211 = { module = "net.minecraftforge:eventbus", version.ref = "forge-eventbus-mc1211" }
forge-spi-mc1211 = { module = "net.minecraftforge:forgespi", version.ref = "forge-spi-mc1211" }

## Forge 1.21.11 ############################################################
forge-universal-mc12111 = { module = "net.minecraftforge:forge", version.ref = "forge-mc12111" }
forge-fmlloader-mc12111 = { module = "net.minecraftforge:fmlloader", version.ref = "forge-mc12111" }
forge-fmlcore-mc12111 = { module = "net.minecraftforge:fmlcore", version.ref = "forge-mc12111" }
forge-javafml-mc12111 = { module = "net.minecraftforge:javafmllanguage", version.ref = "forge-mc12111" }
forge-eventbus-mc12111 = { module = "net.minecraftforge:eventbus", version.ref = "forge-eventbus-mc12111" }
forge-spi-mc12111 = { module = "net.minecraftforge:forgespi", version.ref = "forge-spi-mc12111" }

## Forge 26.2 ###############################################################
forge-universal-mc262 = { module = "net.minecraftforge:forge", version.ref = "forge-mc262" }
forge-fmlloader-mc262 = { module = "net.minecraftforge:fmlloader", version.ref = "forge-mc262" }
forge-fmlcore-mc262 = { module = "net.minecraftforge:fmlcore", version.ref = "forge-mc262" }
forge-javafml-mc262 = { module = "net.minecraftforge:javafmllanguage", version.ref = "forge-mc262" }
forge-eventbus-mc262 = { module = "net.minecraftforge:eventbus", version.ref = "forge-eventbus-mc262" }
forge-spi-mc262 = { module = "net.minecraftforge:forgespi", version.ref = "forge-spi-mc262" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
fabric-loom = { id = "fabric-loom", version.ref = "fabric-loom" }
neoforge-moddev = { id = "net.neoforged.moddev", version.ref = "neoforge-moddev" }
neoforge-moddev-legacy = { id = "net.neoforged.moddev.legacyforge", version.ref = "neoforge-moddev" }
