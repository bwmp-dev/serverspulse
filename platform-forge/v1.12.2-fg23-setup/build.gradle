buildscript {
    repositories {
        maven { url = 'https://files.minecraftforge.net/maven' }
        mavenCentral()
        jcenter()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
    }
}

// ============================================================
// ForgeGradle 2.3 bootstrap for Minecraft 1.12.2
//
// Purpose: generate the MCP-deobfed MC jar that the sibling
//          platform-forge/v1.12.2 project needs to compile
//          and reobfuscate its output.
//
// Requirements:
//   - Gradle 4.10.3 (use the bundled gradlew / gradlew.bat)
//   - Java 8 or Java 11 as the host JVM
//     (set JAVA_HOME before running if your default JDK is newer)
//
// One-time setup:
//   Windows: gradlew.bat exportDeobfJar
//   Unix:    ./gradlew exportDeobfJar
//
// After this succeeds the root `gradlew build` will work.
// ============================================================

apply plugin: 'net.minecraftforge.gradle.forge'

version          = '1.0'
group            = 'com.serverspulse.setup'
archivesBaseName = 'deobf-setup'

minecraft {
    version  = '1.12.2-14.23.5.2847'
    runDir   = 'run'
    mappings = 'stable_39'
}

apply plugin: 'java'

// Compiles the deobfuscated sources generated by decompileMc into a jar
// that the platform-forge/v1.12.2 project can use.
def deobfSourcesDir = file('build/tmp/recompileMc/sources')
def deobfClassesDir = file('build/tmp/deobfMcMCP-classes')
def deobfOutputJar = file('build/tmp/deobfMcMCP/deobfed.jar')

task compileDeobfSources(type: JavaCompile, dependsOn: 'decompileMc') {
    group       = 'setup'
    description = 'Compiles deobfuscated sources into classfiles'
    
    source = deobfSourcesDir
    destinationDir = deobfClassesDir
    
    options.encoding = 'UTF-8'
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
    options.compilerArgs.add('-proc:none')
}

task jarDeobfClasses(type: Jar, dependsOn: 'compileDeobfSources') {
    group       = 'setup'
    description = 'Packages compiled deobf classes into jar'
    
    from deobfClassesDir
    // Include assets from original decompile
    from(file('build/tmp/decompileMc')) {
        include '**/*.json'
        include '**/*.png'
    }
    
    baseName = 'deobfed'
    destinationDir = file('build/tmp/deobfMcMCP')
}

// Copies the MCP-deobfed jar produced by jarDeobfClasses into the
// platform-forge/v1.12.2 project so the main Gradle build can
// compile against it and reobfuscate its output with SpecialSource.
task exportDeobfJar(type: Copy, dependsOn: 'jarDeobfClasses') {
    group       = 'setup'
    description = 'Copies the deobfed MC 1.12.2 jar into ../v1.12.2/build/tmp/deobfMcMCP/'
    from  deobfOutputJar
    into  file('../v1.12.2/build/tmp/deobfMcMCP')
}
