plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.1.10'
    id 'com.gradleup.shadow' version '9.3.1'
}

group = 'com.serverspulse'
version = '0.1.0'

repositories {
    mavenCentral()
    maven { url 'https://maven.minecraftforge.net/' }
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

kotlin {
    jvmToolchain(17)
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}

def deobfJar = file('build/tmp/deobfMcMCP/deobfed.jar')
def agentApiJar = file('../../agent-api/build/libs/agent-api-0.1.0.jar')
def agentCoreJar = file('../../agent-core/build/libs/agent-core-0.1.0.jar')
def mcpToSrgMappings = file("${gradle.gradleUserHomeDir}/caches/minecraft/de/oceanlabs/mcp/mcp_stable/39/1.12.2/srgs/mcp-srg.srg")
def specialSourceShadedJar = file("${gradle.gradleUserHomeDir}/caches/forge_gradle/maven_downloader/net/md-5/SpecialSource/1.8.3/SpecialSource-1.8.3-shaded.jar")

configurations {
    shade {
        transitive = true
    }
}

def verifyDeobfJar = tasks.register('verifyDeobfJar') {
    doLast {
        if (!deobfJar.exists()) {
            throw new GradleException("Missing ${deobfJar}. Generate it with ForgeGradle 2.3 (deobfMcMCP) before building this standalone project.")
        }
        if (!mcpToSrgMappings.exists()) {
            throw new GradleException("Missing MCP->SRG mappings at ${mcpToSrgMappings.absolutePath}")
        }
        if (!specialSourceShadedJar.exists()) {
            throw new GradleException("Missing SpecialSource shaded jar at ${specialSourceShadedJar.absolutePath}")
        }
    }
}

dependencies {
    implementation files(agentApiJar, agentCoreJar)
    compileOnly files(deobfJar)
    compileOnly 'org.apache.logging.log4j:log4j-api:2.17.2'
    compileOnly 'com.google.guava:guava:32.1.3-jre'

    shade files(agentApiJar, agentCoreJar)
    shade 'org.jetbrains.kotlin:kotlin-stdlib:2.1.10'
    shade 'com.google.code.gson:gson:2.10.1'
    shade 'com.squareup.okhttp3:okhttp:4.12.0'
    shade 'org.yaml:snakeyaml:2.2'
}

tasks.shadowJar {
    configurations = [project.configurations.shade]
    archiveBaseName.set('serverspulse-forge-1.12.2')
    archiveClassifier.set('')
    destinationDirectory.set(layout.buildDirectory.dir('tmp/shadow'))
    mergeServiceFiles()

    relocate 'com.google.gson', 'com.serverspulse.libs.gson'
    relocate 'okhttp3', 'com.serverspulse.libs.okhttp3'
    relocate 'okio', 'com.serverspulse.libs.okio'
    relocate 'org.yaml.snakeyaml', 'com.serverspulse.libs.snakeyaml'
}

def reobfShadowJar = tasks.register('reobfShadowJar', Exec) {
    dependsOn tasks.shadowJar
    dependsOn verifyDeobfJar
    group = 'build'
    description = 'Reobfuscates shaded jar from MCP names to SRG names'

    doFirst {
        def inputJar = tasks.shadowJar.archiveFile.get().asFile
        def outputJar = layout.buildDirectory.file("libs/serverspulse-forge-1.12.2-${project.version}.jar").get().asFile
        def remapClasspath = "${specialSourceShadedJar.absolutePath}${File.pathSeparator}${deobfJar.absolutePath}"

        outputJar.parentFile.mkdirs()
        commandLine(
            'java',
            '-cp',
            remapClasspath,
            'net.md_5.specialsource.SpecialSource',
            '-i',
            inputJar.absolutePath,
            '-o',
            outputJar.absolutePath,
            '-m',
            mcpToSrgMappings.absolutePath,
            '-l'
        )
    }
}

tasks.build {
    dependsOn reobfShadowJar
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    dependsOn verifyDeobfJar
    if (rootProject != project) {
        dependsOn ':agent-api:jar', ':agent-core:jar'
    }
}

tasks.withType(JavaCompile).configureEach {
    dependsOn verifyDeobfJar
    if (rootProject != project) {
        dependsOn ':agent-api:jar', ':agent-core:jar'
    }
}

tasks.processResources {
    def props = [version: project.version]
    inputs.properties props
    filesMatching('mcmod.info') {
        expand props
    }
}
